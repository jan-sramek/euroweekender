server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS and proxies over HTTP. Absolute redirects would
    # advertise http:// and conflict with HTTPS canonical/sitemap URLs.
    absolute_redirect off;

    # Prefer prerendered shells. Unknown paths get a real HTTP 404 (not a soft-404
    # homepage) via /404.html, which still boots the SPA for the in-app NotFound page.
    #
    # Sitemap + canonical use no trailing slash. Check $uri/index.html before $uri
    # so /en serves en/index.html without nginx's directory→/en/ 301. Trailing-slash
    # URLs 301 to the slashless form (relative Location, so the scheme stays HTTPS).
    location / {
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri/index.html $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location /api/ {
        proxy_pass http://api:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
